services:
  #PHP Service
  auth_cs_app:
    build:
      context: ./www
      dockerfile: ./deploy/Dockerfile.dev
    container_name: auth_cs_app
    restart: always
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      TZ: ${TIME_ZONE}
    working_dir: /var/www/
    volumes:
      - ./www/:/var/www
    networks:
      - auth_cs_net

  auth_cs_db:
    image: ${DB_VERSION_PG_SQL}
    restart: always
    container_name: auth_cs__db
    tty: true
    volumes:
      - ./dbdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_MULTIPLE_DATABASES=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    networks:
      - auth_cs_net

  #Nginx Service
  auth_cs_webserver:
    image: nginx:alpine
    container_name: service_webserver
    restart: always
    tty: true
    ports:
      - "${NGINX_PORT}:80"
      # - "5443:443"
    volumes:
      - ./www:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      - ./nginx/logs/:/var/log/nginx
      - ./nginx/conf/:/etc/nginx/conf
    networks:
      - auth_cs_net

  #ADMINER
  adminer:
    image: ${ADMINER_VERSION}
    container_name: auth_cs_adminer
    restart: always
    ports:
      - ${ADMINER_PORT}:8080
    networks:
      - auth_cs_net

  redis:
    image: redis:latest
    container_name: auth_cs_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASS}
    volumes:
      - ./redis_data:/data
    networks:
      - auth_cs_net

#Docker Networks
networks:
  auth_cs_net:
    driver: bridge
    external: true
